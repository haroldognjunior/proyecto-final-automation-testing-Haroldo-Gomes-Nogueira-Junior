name: Tests automatizados

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # ubuntu-latest ya trae Google Chrome instalado
      - name: Ejecutar pruebas
        env:
          HEADLESS: "1"
        run: pytest

      - name: Subir reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-${{ github.run_number }}
          path: reports/
