[pytest]
testpaths = tests
pythonpath = .

# Reporte HTML en cada ejecución
addopts = -v --html=reports/reporte.html --self-contained-html

markers =
    ui: pruebas de interfaz con Selenium
    api: pruebas de API con requests

# Logs: se ven por test dentro del reporte y quedan todos en reports/ejecucion.log
log_level = INFO
log_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_date_format = %H:%M:%S
log_file = reports/ejecucion.log
log_file_level = INFO
log_file_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S
